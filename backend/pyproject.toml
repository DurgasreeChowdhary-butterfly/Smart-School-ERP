[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-school-backend"
version = "0.1.0"
description = "Smart School Platform - backend API (modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx2>=2.13",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "BLE",      # blind except
    "C4",       # comprehensions
    "DTZ",      # timezone-aware datetimes
    "T20",      # no print
    "SIM",      # simplify
    "PT",       # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# Developer tools: console output and fixed docker/pytest subprocess calls.
"tools/**" = ["T201", "S603", "S607"]

[tool.ruff.lint.isort]
# The local "alembic/" migrations folder must not make the alembic package look first-party.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are intentionally used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic/env.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: test requires a running PostgreSQL test database",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
